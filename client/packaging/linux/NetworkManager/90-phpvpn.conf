# phpvpn owns its TUN interface completely: the service creates it, assigns
# the VPN address and the single on-link route, and the kernel removes it when
# the service stops. NetworkManager must never manage it, add addresses,
# routes or DNS to it, or take it over as an external connection.
# Installed by the phpvpn package; a device section does not replace any
# unmanaged-devices list of the administrator.
[device-phpvpn]
match-device=interface-name:phpvpn
managed=0
