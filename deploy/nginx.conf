# nginx server block for phpvpn.
#
# nginx ignores .htaccess entirely, so the deny rules that phpvpn.php writes
# into QUEUE_ROOT do nothing here. Either keep QUEUE_ROOT outside the document
# root, which is strongly preferred, or rely on the location blocks below.

server {
    listen 443 ssl;
    http2 on;
    server_name vpn.example.com;

    ssl_certificate     /etc/letsencrypt/live/vpn.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpn.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/vpn;
    index phpvpn.php;

    # A sync body stays under MAX_REQUEST_BYTES. Keep a small margin above it
    # and keep post_max_size in PHP above this value as well.
    client_max_body_size 2m;
    client_body_buffer_size 128k;

    # Every request is short by design, so a long timeout only hides problems.
    fastcgi_read_timeout 30s;
    send_timeout 30s;

    location = /phpvpn.php {
        include        fastcgi_params;
        fastcgi_pass   php_upstream;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Lets phpvpn.php recognise HTTPS behind a proxy. Only meaningful when
        # TRUST_PROXY_HEADERS is true and this really is the terminating proxy.
        fastcgi_param  HTTP_X_FORWARDED_PROTO $scheme;

        # The response is already sized by MAX_RESPONSE_BYTES and is opaque
        # ciphertext, so buffering it whole only adds latency.
        fastcgi_buffering off;
    }

    # Defence in depth for the case where QUEUE_ROOT lives under the web root.
    location ~ ^/phpvpn(/|$) {
        deny all;
        return 404;
    }
    location ~ \.(data|sending|writing|error|stat|lock|bin|log)$ {
        deny all;
        return 404;
    }

    # Nothing else in this root is meant to be served.
    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name vpn.example.com;
    return 301 https://$host$request_uri;
}

# Several PHP-FPM children are required, otherwise nginx serialises the short
# requests of all clients through a single worker.
upstream php_upstream {
    server unix:/run/php/php8.2-fpm.sock;
}
